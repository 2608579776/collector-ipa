name: Collector
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Collector:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Bridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.94zero.collector
        PRODUCT_NAME: Collector
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/Collector-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Collector.entitlements
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Bridge"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: collector
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 连接本地 C2 服务器
        UIRequiredDeviceCapabilities:
          - arm64

schemes:
  Collector:
    build:
      targets:
        Collector: all
    run:
      config: Release

